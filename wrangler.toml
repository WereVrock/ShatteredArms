name = "shattered-arms"
main = "_worker.js"
compatibility_date = "2024-10-01"

[assets]
directory = "."
binding = "ASSETS"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "HIGHSCORES"
class_name = "HighscoreBoard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v2"
new_classes = ["HighscoreBoard"]